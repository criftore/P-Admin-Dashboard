<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project: Admin Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="search">
          <img class="icon" src="icon/magnify.svg" />
          <input type="search" class="input" />
        </div>
        <div class="account">
          <img class="icon" src="icon/bell-ring-outline.svg" />
          <img class="avatar" src="c-logo.png" />
          <span>Criftore Project</span>
        </div>
        <div class="profile">
          <img class="l-avatar" src="c-logo.png" />
          <span>Hi there,</span>
          <p>Criftore Project (@criftore)</p>
        </div>
        <div class="action">
          <button>New</button>
          <button>Upload</button>
          <button>Share</button>
        </div>
      </div>
      <div class="sidebar">
        <h2 class="dashboard">
          <img class="dash-icon" src="icon/view-dashboard.svg" />Dashboard
        </h2>
        <ul class="direction">
          <li><img class="icon" src="icon/home.svg" /> Home</li>
          <li>
            <img
              class="icon"
              src="icon/card-account-details-outline.svg"
            />Profile
          </li>
          <li><img class="icon" src="icon/message-reply.svg" />Message</li>
          <li><img class="icon" src="icon/clock-time-three.svg" />History</li>
          <li>
            <img class="icon" src="icon/note-multiple-outline.svg" />Tasks
          </li>
          <li><img class="icon" src="icon/account-group.svg" />Communities</li>
        </ul>
        <ul class="menu">
          <li><img class="icon" src="icon/cog.svg" />Setting</li>
          <li><img class="icon" src="icon/help-box-outline.svg" />Support</li>
          <li><img class="icon" src="icon/shield-check.svg" />Privacy</li>
        </ul>
      </div>
      <div class="main">
        <div></div>
        <div></div>
        <div></div>
      </div>
    </div>
  </body>
</html>
